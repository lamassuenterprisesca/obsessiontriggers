    var FALLBACK = 'nosub';

    function clean(v) {
      return v && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : null;

      var m = document.cookie.match(/(?:^|;\s*)sub2=([^;]*)/);

    }

    var urlSub2 = clean(new URLSearchParams(location.search).get('sub2'));

    // Remember the last email actually clicked, for later visits that arrive
    // with no sub2 (bookmark, typed URL). Reloads and back/forward don't count.
    var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    var isFreshClick = !nav || nav.type === 'navigate';

    if (urlSub2 && isFreshClick) {
      document.cookie = 'sub2=' + urlSub2 + ';path=/;max-age=' + MAXAGE + ';SameSite=Lax';

    var sub2 = urlSub2 || cookieSub2() || FALLBACK;

    function stampAll() {
      var links = document.querySelectorAll(OFFER_LINKS);
      for (var i = 0; i < links.length; i++) {
        var u = new URL(links[i].href, location.href);
        u.searchParams.set('sub2', sub2);
        links[i].href = u.toString();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', stampAll);
    } else {
      stampAll();
    }
  })();
