  <style>
    * {

    body {

<body>

  <main class="bridge">

  <!--
    sub2 tracking: email links arrive as /lander/stealth?sub2=07oct26e1
    and every offer link on the page gets that sub2 appended.
    Each tab keeps the sub2 it was opened with. Leave sub2 OFF the hrefs above.
  -->
  <script>
  (function () {
    var FALLBACK = 'nosub';
    var MAXAGE = 60 * 60 * 24 * 7; // 7 days
    var OFFER_LINKS = 'a.image-link, a.cta-button';

    function clean(v) {
      return v && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : null;
    }
    function cookieSub(name) {
      var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
      return m ? clean(decodeURIComponent(m[1])) : null;
    }
    function cookieSub2() { return cookieSub('sub2'); }

    // sub3/sub4 carry the subscriber ID and signup month for LTV tracking.
    var EXTRA = ['sub3', 'sub4'];
    var params = new URLSearchParams(location.search);
    var urlSub2 = clean(params.get('sub2'));

    // Remember the last email actually clicked, for later visits that arrive
    // with no sub2 (bookmark, typed URL). Reloads and back/forward don't count.
    var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    var isFreshClick = !nav || nav.type === 'navigate';

    if (urlSub2 && isFreshClick) {
      document.cookie = 'sub2=' + urlSub2 + ';path=/;max-age=' + MAXAGE + ';SameSite=Lax';
      EXTRA.forEach(function (k) {
        var v = clean(params.get(k));
        document.cookie = k + '=' + (v || '') + ';path=/;max-age=' + (v ? MAXAGE : 0) + ';SameSite=Lax';
      });
    }

    // The sub2 in this tab's URL always wins, so a tab opened from email 1
    // keeps sending email 1's ID even after email 2 is opened in another tab.
    var sub2 = urlSub2 || cookieSub2() || FALLBACK;
    // Extras follow the same source as sub2: this URL if it had a sub2, else the cookie.
    var extras = {};
    EXTRA.forEach(function (k) {
      var v = urlSub2 ? clean(params.get(k)) : cookieSub(k);
      if (v) extras[k] = v;
    });

    // Visit / click-through tracking: one row per event in the "Bridge Page Tracking" Google Sheet.
    var LOG_URL = 'https://script.google.com/macros/s/AKfycbwZJt8cAWTwhMmIBAL5UnwOdP6vmcOHHK8Pas1SXOgh-ZJRF0SURjJ1iCZDoBVTyV478Q/exec';
    function visitorId() {
      try {
        var v = localStorage.getItem('bpv');
        if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bpv', v); }
        return v;
      } catch (e) { return ''; }
    }
    function logEvent(event) {
      try {
        var body = JSON.stringify({
          event: event, page: location.pathname, sub2: sub2, sub3: extras.sub3 || '',
          visitor: visitorId(), t: new Date().toISOString(), nav: nav ? nav.type : '',
          ref: document.referrer, ua: navigator.userAgent
        });
        if (navigator.sendBeacon && navigator.sendBeacon(LOG_URL, new Blob([body], { type: 'text/plain' }))) return;
        fetch(LOG_URL, { method: 'POST', mode: 'no-cors', keepalive: true, body: body });
      } catch (e) {}
    }

    function stampAll() {
      var links = document.querySelectorAll(OFFER_LINKS);
      for (var i = 0; i < links.length; i++) {
        var u = new URL(links[i].href, location.href);
        u.searchParams.set('sub2', sub2);
        for (var k in extras) u.searchParams.set(k, extras[k]);
        links[i].href = u.toString();
        links[i].addEventListener('click', function () { logEvent('click'); });
      }
      logEvent('view');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', stampAll);
    } else {
      stampAll();
    }
  })();
  </script>

</body>
</html>
